<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="device-width, initial-scale=1" />
    <title>Courses</title>
    <link rel="icon" type="image/x-icon" href="./assets/logo.png" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/courses.css" />
  </head>

  <body>
    <header class="p-3 mb-3 border-bottom">
      <div class="container-fluid mx-0 w-100">
        <div class="d-flex flex-wrap align-items-center justify-content-center">
          <ul
            class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"
          >
            <li>
              <a
                href="./dashboard.html"
                class="nav-link px-2 link-body-emphasis"
                >Dashboard</a
              >
            </li>
            <li>
              <a href="#" class="nav-link px-2 link-body-emphasis">Study</a>
            </li>
            <li>
              <a href="./calendar.html" class="nav-link px-2 link-body-emphasis">Calendar</a>
            </li>
            <li>
              <a href="#" class="nav-link px-2 link-secondary">Courses</a>
            </li>
          </ul>
          <h3 class="col-12 text-center col-lg-auto fw-4 me-lg-2">
            Study Buddy
          </h3>
          <div class="dropdown text-end">
            <a
              href="#"
              class="d-block link-body-emphasis text-decoration-none dropdown-toggle"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <img
                src="./assets/profile.svg"
                alt="mdo"
                width="32"
                height="32"
                class="rounded-circle"
              />
            </a>
            <ul class="dropdown-menu text-small">
              <li><a class="dropdown-item" href="#">Settings</a></li>
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="#">Sign out</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>

    <h1 class="display-5 fw-bold ms-3">Courses</h1>

    <div class="container-fluid px-4">
      <div class="row gx-2">
        <div class="col-12 col-md-6 col-lg-4 col-xl-3 mb-2">
          <a href="#" style="text-decoration: none">
            <div class="card course" style="--background-color: red; --secondary-color: rgb(241, 107, 107);">
              <div class="card-body">
                <h5 class="card-title fw-bold">Course Code 1</h5>
                <p class="card-text">Course Name 1</p>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-md-6 col-lg-4 col-xl-3 mb-2">
          <a href="#" style="text-decoration: none">
            <div class="card course" style="--background-color: rgb(75, 75, 253); --secondary-color: rgb(111, 124, 235);">
              <div class="card-body">
                <h5 class="card-title fw-bold">Course Code 2</h5>
                <p class="card-text">Course Name 2</p>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-md-6 col-lg-4 col-xl-3 mb-2">
          <a href="#" style="text-decoration: none">
            <div class="card course" style="--background-color: rgb(64, 154, 64); --secondary-color: rgb(81, 205, 81);">
              <div class="card-body">
                <h5 class="card-title fw-bold">Course Code 3</h5>
                <p class="card-text">Course Name 3</p>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-md-6 col-lg-4 col-xl-3 mb-2">
          <a href="#" style="text-decoration: none">
            <div class="card course" style="--background-color: orange; --secondary-color: gold">
              <div class="card-body">
                <h5 class="card-title fw-bold">Course Code 4</h5>
                <p class="card-text">Course Name 4</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>

    <button
      class="btn btn-primary rounded-circle p-3 position-fixed"
      style="
        bottom: 32px;
        right: 32px;
        z-index: 100;
        font-size: 2rem;
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
       <svg
        xmlns="http://www.w3.org/2000/svg"
        width="64"
        height="64"
        fill="currentColor"
        class="bi bi-plus-circle"
        viewBox="0 0 16 16"
      >
        <path
          d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
        />
        <path
          d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"
        />
      </svg>
    </button>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
