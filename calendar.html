<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link rel="icon" type="image/x-icon" href="./assets/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />
  <link rel="stylesheet" href="./css/dashboard.css"/>
  <link rel="stylesheet" href="./css/calendar.css" />
</head>

<body>
  <header class="p-3 mb-3 border-bottom">
    <div class="container-fluid mx-0 w-100">
      <div class="d-flex flex-wrap align-items-center justify-content-center">
        <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
          <li>
            <a href="./dashboard.html" class="nav-link mx-2 link-body-emphasis border rounded">Dashboard</a>
          </li>
          <li>
            <a href="#" class="nav-link mx-2 link-body-emphasis border rounded">Study</a>
          </li>
          <li>
            <a href="#" class="nav-link mx-2 link-secondary border rounded">Calendar</a>
          </li>
          <li>
            <a href="./courses.html" class="nav-link mx-2 link-body-emphasis border rounded">Courses</a>
          </li>
        </ul>
        <h3 class="col-12 text-center col-lg-auto fw-4 me-lg-2">
          Study Buddy
        </h3>
        <div class="dropdown text-end">
          <a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown"
            aria-expanded="false">
            <img src="./assets/profile.svg" alt="mdo" width="32" height="32" class="rounded-circle" />
          </a>
          <ul class="dropdown-menu text-small">
            <li><a class="dropdown-item" href="#">Settings</a></li>
            <li><a class="dropdown-item" href="#">Profile</a></li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li><a class="dropdown-item" href="#">Sign out</a></li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row">
      <header class="d-flex flex-wrap mb-2 pt-2 border-bottom">
        <!--Add animation to expand calendar when month name is clicked-->
        <a href="#" class="d-flex align-items-center mb-2 px-3 link-body-emphasis text-decoration-none" id="month-name">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar-fill"
            viewBox="0 0 16 16">
            <path
              d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V5h16V4H0V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5" />
          </svg>
          <span class="ps-2 fs-4">Month Name</span> </a>
      </header>
    </div>

    <div class="row text-center mb-2 pb-2 border-bottom">
      <div class="col">Sun</div>
      <div class="col">Mon</div>
      <div class="col">Tue</div>
      <div class="col">Wed</div>
      <div class="col">Thu</div>
      <div class="col">Fri</div>
      <div class="col">Sat</div>
    </div>

    <div class="row text-center pb-2 border-bottom">
      <div class="col">
        <button class="btn btn-circle border p">1</button>
      </div>
      <div class="col">
        <button class="btn btn-circle border">2</button>
      </div>
      <div class="col">
        <button class="btn btn-circle border">3</button>
      </div>
      <div class="col">
        <button class="btn btn-circle border">4</button>
      </div>
      <div class="col">
        <button class="btn btn-circle border">5</button>
      </div>
      <div class="col">
        <button class="btn btn-circle border">6</button>
      </div>
      <div class="col">
        <button class="btn btn-circle border">7</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
    crossorigin="anonymous"></script>
</body>

</html>
